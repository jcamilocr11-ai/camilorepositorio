<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clientes - API REST y Big Data</title>
</head>
<body>

<h1>Gestión de Clientes</h1>

<h2>Crear cliente</h2>

<label>Nombre:</label>
<input id="nombre" type="text">
<br><br>

<label>Correo:</label>
<input id="correo" type="email">
<br><br>

<label>Teléfono:</label>
<input id="telefono" type="text">
<br><br>

<label>Ciudad:</label>
<input id="ciudad" type="text">
<br><br>

<label>Edad:</label>
<input id="edad" type="number">
<br><br>

<button id="btnCrear">POST crear cliente</button>

<hr>

<h2>Clientes registrados</h2>

<button id="btnCargar">GET listar clientes</button>

<div id="lista"></div>

<hr>

<h2>Big Data</h2>

<h3>Reporte Batch</h3>

<button id="btnBatch">Cargar reporte Batch</button>

<pre id="batch"></pre>

<h3>Calidad de datos</h3>

<button id="btnCalidad">Cargar calidad de datos</button>

<pre id="calidad"></pre>

<h3>Clientes validos</h3>

<button id="btnValidos">Cargar clientes validos</button>

<pre id="validos"></pre>

<h3>Reporte de clientes</h3>

<button id="btnReporteClientes">Cargar reporte de clientes</button>

<pre id="reporteClientes"></pre>

<h3>Eventos registrados</h3>

<button id="btnEventos">Cargar eventos</button>

<pre id="eventos"></pre>

<hr>

<h2>Registro de solicitudes</h2>

<pre id="log"></pre>

<script>

    const lista = document.getElementById('lista');
    const log = document.getElementById('log');

    function escribirLog(texto) {

        log.textContent += texto + '\n';

    }

    async function pedir(url, opciones = {}) {

        const respuesta = await fetch(url, opciones);

        const texto = await respuesta.text();

        let datos;

        try {

            datos = JSON.parse(texto);

        } catch {

            datos = texto;

        }

        escribirLog(
            `${opciones.method || 'GET'} ${url} -> ${respuesta.status}`
        );

        return {
            respuesta,
            datos
        };

    }

    async function cargar() {

        const resultado = await pedir('/api/clientes');

        lista.innerHTML = '';

        if (!Array.isArray(resultado.datos)) {

            lista.textContent = 'Error al cargar los clientes';

            return;

        }

        resultado.datos.forEach(cliente => {

            const div = document.createElement('div');

            div.innerHTML = `
                <p>
                    <strong>ID:</strong> ${cliente.id}<br>
                    <strong>Nombre:</strong> ${cliente.nombre}<br>
                    <strong>Correo:</strong> ${cliente.correo}<br>
                    <strong>Teléfono:</strong> ${cliente.telefono}<br>
                    <strong>Ciudad:</strong> ${cliente.ciudad}<br>
                    <strong>Edad:</strong> ${cliente.edad}
                </p>

                <button onclick="actualizar(${cliente.id})">
                    PUT actualizar
                </button>

                <button onclick="eliminar(${cliente.id})">
                    DELETE eliminar
                </button>

                <hr>
            `;

            lista.appendChild(div);

        });

    }

    async function crear() {

        const nuevoCliente = {

            nombre: document.getElementById('nombre').value,

            correo: document.getElementById('correo').value,

            telefono: document.getElementById('telefono').value,

            ciudad: document.getElementById('ciudad').value,

            edad: parseInt(
                document.getElementById('edad').value
            )

        };

        const resultado = await pedir('/api/clientes', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify(nuevoCliente)

        });

        escribirLog(
            'POST respuesta: ' +
            JSON.stringify(resultado.datos)
        );

        document.getElementById('nombre').value = '';

        document.getElementById('correo').value = '';

        document.getElementById('telefono').value = '';

        document.getElementById('ciudad').value = '';

        document.getElementById('edad').value = '';

        await cargar();

    }

    async function actualizar(id) {

        const cliente = prompt(
            'Escribe el nuevo nombre del cliente:'
        );

        if (cliente === null) {

            return;

        }

        const resultadoGet =
            await pedir(`/api/clientes/${id}`);

        if (!resultadoGet.datos ||
            resultadoGet.datos.mensaje) {

            alert('No se encontró el cliente');

            return;

        }

        const datosActualizados = {

            nombre: cliente,

            correo: resultadoGet.datos.correo,

            telefono: resultadoGet.datos.telefono,

            ciudad: resultadoGet.datos.ciudad,

            edad: resultadoGet.datos.edad

        };

        const resultado = await pedir(
            `/api/clientes/${id}`,
            {
                method: 'PUT',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(datosActualizados)

            }
        );

        escribirLog(
            'PUT respuesta: ' +
            JSON.stringify(resultado.datos)
        );

        await cargar();

    }

    async function eliminar(id) {

        const confirmar = confirm(
            '¿Seguro que quieres eliminar el cliente ' +
            id +
            '?'
        );

        if (!confirmar) {

            return;

        }

        const resultado = await pedir(
            `/api/clientes/${id}`,
            {
                method: 'DELETE'
            }
        );

        escribirLog(
            'DELETE respuesta: ' +
            JSON.stringify(resultado.datos)
        );

        await cargar();

    }

    async function cargarBatch() {

        const resultado =
            await pedir('/api/bigdata/reporte-batch');

        document.getElementById('batch').textContent =
            resultado.datos.contenido;

    }

    async function cargarCalidad() {

        const resultado =
            await pedir('/api/bigdata/calidad');

        document.getElementById('calidad').textContent =
            resultado.datos.contenido;

    }

    async function cargarValidos() {

        const resultado =
            await pedir('/api/bigdata/clientes-validos');

        document.getElementById('validos').textContent =
            resultado.datos.contenido;

    }

    async function cargarReporteClientes() {

        const resultado =
            await pedir('/api/bigdata/reporte-clientes');

        document.getElementById('reporteClientes').textContent =
            resultado.datos.contenido;

    }

    async function cargarEventos() {

        const resultado =
            await pedir('/api/bigdata/eventos');

        document.getElementById('eventos').textContent =
            resultado.datos.contenido;

    }

    document
        .getElementById('btnCargar')
        .addEventListener('click', cargar);

    document
        .getElementById('btnCrear')
        .addEventListener('click', crear);

    document
        .getElementById('btnBatch')
        .addEventListener('click', cargarBatch);

    document
        .getElementById('btnCalidad')
        .addEventListener('click', cargarCalidad);

    document
        .getElementById('btnValidos')
        .addEventListener('click', cargarValidos);

    document
        .getElementById('btnReporteClientes')
        .addEventListener('click', cargarReporteClientes);

    document
        .getElementById('btnEventos')
        .addEventListener('click', cargarEventos);

    cargar();

</script>

</body>
</html>
