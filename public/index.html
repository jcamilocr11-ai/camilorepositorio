<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio HTTP de clientes</title>
</head>

<body>

    <h1>Clientes y solicitudes HTTP</h1>

    <h2>Listar clientes</h2>
    <button id="btnCargar">GET listar clientes</button>

    <h2>Crear cliente</h2>

    <label>Nombre:</label>
    <input id="nombre" type="text">
    <br><br>

    <label>Correo:</label>
    <input id="correo" type="email">
    <br><br>

    <label>Teléfono:</label>
    <input id="telefono" type="text">
    <br><br>

    <label>Ciudad:</label>
    <input id="ciudad" type="text">
    <br><br>

    <label>Edad:</label>
    <input id="edad" type="number">
    <br><br>

    <button id="btnCrear">POST crear cliente</button>

    <h2>Clientes registrados</h2>
    <div id="lista"></div>

    <h2>Registro de solicitudes</h2>
    <pre id="log"></pre>

    <script>
        const lista = document.getElementById('lista');
        const log = document.getElementById('log');

        function escribirLog(texto) {
            log.textContent += texto + '\n';
        }

        async function pedir(url, opciones = {}) {
            const respuesta = await fetch(url, opciones);
            const texto = await respuesta.text();

            let datos;

            try {
                datos = JSON.parse(texto);
            } catch {
                datos = texto;
            }

            escribirLog(
                `${opciones.method || 'GET'} ${url} -> ${respuesta.status}`
            );

            return {
                respuesta,
                datos
            };
        }

        async function cargar() {
            const resultado = await pedir('/api/clientes');

            lista.innerHTML = '';

            resultado.datos.forEach(cliente => {
                const div = document.createElement('div');

                div.innerHTML = `
                    <p>
                        <strong>ID:</strong> ${cliente.id}<br>
                        <strong>Nombre:</strong> ${cliente.nombre}<br>
                        <strong>Correo:</strong> ${cliente.correo}<br>
                        <strong>Teléfono:</strong> ${cliente.telefono}<br>
                        <strong>Ciudad:</strong> ${cliente.ciudad}<br>
                        <strong>Edad:</strong> ${cliente.edad}<br>

                        <button onclick="eliminar(${cliente.id})">
                            DELETE eliminar
                        </button>
                    </p>
                    <hr>
                `;

                lista.appendChild(div);
            });
        }

        async function crear() {
            const nuevoCliente = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                telefono: document.getElementById('telefono').value,
                ciudad: document.getElementById('ciudad').value,
                edad: parseInt(document.getElementById('edad').value)
            };

            const resultado = await pedir('/api/clientes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(nuevoCliente)
            });

            escribirLog(
                'Cliente creado: ' + JSON.stringify(resultado.datos)
            );

            document.getElementById('nombre').value = '';
            document.getElementById('correo').value = '';
            document.getElementById('telefono').value = '';
            document.getElementById('ciudad').value = '';
            document.getElementById('edad').value = '';

            await cargar();
        }

        async function eliminar(id) {
            const resultado = await pedir(`/api/clientes/${id}`, {
                method: 'DELETE'
            });

            escribirLog(
                'Cliente eliminado: ' + JSON.stringify(resultado.datos)
            );

            await cargar();
        }

        document
            .getElementById('btnCargar')
            .addEventListener('click', cargar);

        document
            .getElementById('btnCrear')
            .addEventListener('click', crear);

        cargar();
    </script>

</body>
</html>
